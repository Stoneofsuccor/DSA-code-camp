<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Signup</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header><h1>Welcome</h1></header>
  <main class="auth-container">
    <form id="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password (min 8 chars)</label>
        <input type="password" id="password" required minlength="8">
      </div>
      <div class="form-group" id="role-group">
        <label for="role">Role (for Signup)</label>
        <select id="role">
          <option value="attendee">Attendee</option>
          <option value="organizer">Organizer</option>
          <option value="staff">Staff</option>
        </select>
      </div>
      
      <!-- Buttons for Login and Signup -->
      <div style="display: flex; gap: 1rem; margin-top: 1rem;">
        <button type="submit" id="login-btn" class="btn">Login</button>
        <button type="button" id="signup-btn" class="btn">Sign Up</button>
      </div>
      
      <p id="auth-error" class="error-text" style="margin-top: 1rem;"></p>
    </form>
  </main>
  <script type="module" src="/js/pages/auth.js"></script>
</body>
</html>
